<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Em có điều muốn nói với chị…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde8f0; --bg2:#ffd3e4; --card:#fffafc; --soft:#fff1f6; --ink:#5a2340; --muted:#9c6a83;
  --line:#f4d0df; --accent:#d93f7c; --accent-ink:#ffffff; --shadow:0 12px 32px rgba(217,63,124,.14);
  --disabled:#d9b9c8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#22101a; --bg2:#37162a; --card:#2e1a26; --soft:#3a2130; --ink:#ffe0ec; --muted:#d79bb6;
    --line:#50293c; --accent:#f27aa6; --accent-ink:#3a0f22; --shadow:0 12px 32px rgba(0,0,0,.4);
    --disabled:#6b4a5c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#22101a; --bg2:#37162a; --card:#2e1a26; --soft:#3a2130; --ink:#ffe0ec; --muted:#d79bb6;
  --line:#50293c; --accent:#f27aa6; --accent-ink:#3a0f22; --shadow:0 12px 32px rgba(0,0,0,.4);
  --disabled:#6b4a5c; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Baloo 2","Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45;
  background:
    radial-gradient(60vmax 40vmax at 10% -10%, var(--bg2), transparent 60%),
    radial-gradient(50vmax 40vmax at 110% 110%, var(--bg2), transparent 60%),
    var(--bg);
  background-color:var(--bg);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.wrap{max-width:440px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px 18px 20px;border:1px solid var(--line)}
.card + .card{margin-top:16px}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.2px}
h2{font-size:24px;line-height:1.2;margin:14px 0 4px;font-weight:800;text-align:center}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.to-chip{display:inline-block;background:var(--soft);border:1px solid var(--line);color:var(--accent);
  font-weight:700;font-size:13px;padding:2px 12px;border-radius:16px;margin-bottom:10px}

/* Polaroid */
.polaroid{margin:8px auto 18px;width:86%;background:#fff;border-radius:10px;padding:10px 10px 38px;
  box-shadow:0 8px 22px rgba(90,35,64,.18);transform:rotate(-1.6deg)}
.polaroid img{display:block;width:100%;height:auto;border-radius:4px;aspect-ratio:4/5;object-fit:cover}
.polaroid .cap{margin:6px 0 2px;text-align:center;color:#8a4a67;font-weight:700;font-size:17px}

/* Question */
.ask{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:16px 14px;text-align:center;
  font-weight:700;font-size:19px}
.actions{position:relative;min-height:150px;margin-top:14px}
.btn{border:0;border-radius:18px;font-weight:700;font-size:16px;padding:12px 16px}
.yes{width:64%;height:52px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 8px 18px rgba(217,63,124,.28);transition:transform .2s ease}
.yes:active{transform:scale(.97)}
.no{position:absolute;right:0;top:0;background:var(--card);border:1px solid var(--line);color:var(--ink);
  font-size:14px;padding:10px 14px;max-width:58%;box-shadow:0 4px 12px rgba(90,35,64,.1);
  transition:left .22s cubic-bezier(.3,1.4,.5,1),top .22s cubic-bezier(.3,1.4,.5,1)}
.note{position:absolute;left:0;right:0;bottom:0;text-align:center;color:var(--muted);font-size:13px;margin:0}

/* Pick section */
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);color:var(--accent);
  font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px}
.center{text-align:center}
.cal{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:12px 10px 10px;margin-top:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;font-weight:700}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.nav[disabled]{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1;border:0;background:transparent;border-radius:50%;font-weight:600;font-size:15px;position:relative;
  display:flex;align-items:center;justify-content:center;min-height:38px}
.day[disabled]{color:var(--disabled);cursor:default;font-weight:400}
.day:not([disabled]):hover{background:var(--line)}
.day.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel::after{background:var(--accent-ink)}
.label{font-weight:700;font-size:14px;margin:18px 2px 8px}
.time{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;
  justify-content:center;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
.col .ghost{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:18px;height:32px;width:100%;border-radius:10px}
.col .ghost:hover{background:var(--line)}
.col .cur{width:100%;text-align:center;font-weight:800;font-size:30px;padding:2px 0;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 3px 8px rgba(90,35,64,.08)}
.colon{font-weight:800;font-size:28px;padding-bottom:2px}
.units{display:flex;justify-content:center;gap:112px;color:var(--muted);font-size:12px;margin-top:4px}
.when{color:var(--accent);font-weight:700;font-size:14px;text-align:center;margin:12px 0 0}
.movies{display:flex;flex-direction:column;gap:10px}
.movie{text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:11px 14px;
  transition:border-color .15s, background .15s}
.movie b{display:block;font-size:16px}
.movie span{color:var(--muted);font-size:14px}
.movie[aria-pressed="true"]{border-color:var(--accent);background:var(--card)}
.movie[aria-pressed="true"] b::after{content:" ♥";color:var(--accent)}
.confirm{width:100%;margin-top:16px;height:54px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 8px 18px rgba(217,63,124,.28)}
.hint{min-height:22px;margin:8px 0 0;text-align:center;color:var(--accent);font-weight:600;font-size:14px}

/* Done */
.ticket{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:12px}
.ticket p{margin:0}
.table{border:1px solid var(--line);border-radius:20px;padding:6px 16px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.row:last-child{border-bottom:0}
.row span{color:var(--muted)}
.row b{font-weight:700;text-align:right}
.ghost-btn{width:100%;margin-top:14px;background:var(--card);border:1px solid var(--line);height:50px}
.send{width:100%;margin-top:10px;height:50px;background:var(--accent);color:var(--accent-ink)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--card);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:20}

/* Confetti */
.fx{position:fixed;top:-30px;pointer-events:none;z-index:15;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg);opacity:.2}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
  .fx{display:none}
}
</style>
</head>

      '<div class="label">Chị muốn đi tầm mấy giờ?</div>' +
      '<div class="time">' +
        '<div class="col" id="colH"></div><div class="colon">:</div><div class="col" id="colM"></div>' +
      '</div>' +
      '<div class="units"><span>giờ</span><span>phút</span></div>' +
      '<p class="when" id="when"></p>' +
      '<div class="label">Chọn phim mình xem</div>' +
      '<div class="movies" id="movies"></div>' +
      '<p class="hint" id="hint" role="status"></p>' +
      '<button class="btn confirm" id="confirm" type="button">Xác nhận nha 💗</button>' +
    '</section>' +
    '<section class="card" id="s3" hidden></section>';

    $("#toChip").textContent = data.from + " gửi " + data.to + " 💌";

    /* --- Nút No trốn --- */
    var actions = $("#actions"), yes = $("#yes"), no = $("#no");
    function dodge(e){
      if (e && e.preventDefault) e.preventDefault();
      var now = Date.now(); if (now - lastDodge < 220) return; lastDodge = now;
      tries++;
      no.textContent = NO_TEXTS[Math.min(tries, NO_TEXTS.length - 1)];
      var box = actions.getBoundingClientRect();
      var bw = no.offsetWidth, bh = no.offsetHeight;
      var minY = yes.offsetHeight + 10, maxY = Math.max(minY, box.height - bh - 26);
      var x = Math.random() * Math.max(0, box.width - bw);
      var y = minY + Math.random() * (maxY - minY);
      no.style.right = "auto"; no.style.left = x + "px"; no.style.top = y + "px";
      yes.style.transform = "scale(" + Math.min(1.12, 1 + tries * 0.02) + ")";
      yes.style.transformOrigin = "left center";
    }
    no.addEventListener("pointerenter", dodge);
    no.addEventListener("pointerdown", dodge);
    no.addEventListener("click", dodge);

    yes.addEventListener("click", function(){
      burst();
      $("#s2").hidden = false;
      setTimeout(function(){ $("#s2").scrollIntoView({behavior: reduced() ? "auto" : "smooth", block:"start"}); }, 60);
    });

    /* --- Lịch --- */
    var dows = ["T2","T3","T4","T5","T6","T7","CN"];
    $("#dows").innerHTML = dows.map(function(d){ return '<div class="dow">' + d + '</div>'; }).join("");
    function renderCal(){
      var y = st.vy, m = st.vm;
      $("#monthLbl").textContent = "Tháng " + (m + 1) + ", " + y;
      var first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7;
      var count = new Date(y, m + 1, 0).getDate();
      var html = "";
      for (var i = 0; i < offset; i++) html += "<div></div>";
      for (var d = 1; d <= count; d++){
        var dt = new Date(y, m, d);
        var past = dt < today, isToday = dt.getTime() === today.getTime();
        var sel = st.date && st.date.getTime() === dt.getTime();
        html += '<button type="button" class="day' + (isToday ? " today" : "") + (sel ? " sel" : "") + '" data-d="' + d + '"' +
                (past ? " disabled" : "") + ' aria-pressed="' + (sel ? "true" : "false") + '">' + d + '</button>';
      }
      $("#days").innerHTML = html;
      $("#prevM").disabled = (y === today.getFullYear() && m === today.getMonth());
    }
    $("#days").addEventListener("click", function(e){
      var b = e.target.closest(".day"); if (!b || b.disabled) return;
      st.date = new Date(st.vy, st.vm, parseInt(b.dataset.d, 10));
      renderCal(); renderWhen();
    });
    $("#prevM").onclick = function(){ st.vm--; if (st.vm < 0){ st.vm = 11; st.vy--; } renderCal(); };
    $("#nextM").onclick = function(){ st.vm++; if (st.vm > 11){ st.vm = 0; st.vy++; } renderCal(); };

    /* --- Giờ --- */
    function stepVal(k, dir){
      if (k === "h") st.hour = (st.hour + dir + 24) % 24;
      else st.min = (st.min + dir * 5 + 60) % 60;
      renderTime(); renderWhen();
    }
    function colHtml(k){
      var v = k === "h" ? st.hour : st.min, step = k === "h" ? 1 : 5, mod = k === "h" ? 24 : 60;
      var prev = (v - step + mod) % mod, next = (v + step) % mod;
      var nm = k === "h" ? "giờ" : "phút";
      return '<button type="button" class="ghost" data-k="' + k + '" data-dir="-1" aria-label="Giảm ' + nm + '">' + pad(prev) + '</button>' +
             '<div class="cur" aria-live="polite">' + pad(v) + '</div>' +
             '<button type="button" class="ghost" data-k="' + k + '" data-dir="1" aria-label="Tăng ' + nm + '">' + pad(next) + '</button>';
    }
    function renderTime(){ $("#colH").innerHTML = colHtml("h"); $("#colM").innerHTML = colHtml("m"); }
    ["colH","colM"].forEach(function(id){
      var el = $("#" + id);
      el.addEventListener("click", function(e){
        var b = e.target.closest(".ghost"); if (!b) return;
        stepVal(b.dataset.k, parseInt(b.dataset.dir, 10));
      });
      el.addEventListener("wheel", function(e){
        e.preventDefault();
        stepVal(id === "colH" ? "h" : "m", e.deltaY > 0 ? 1 : -1);
      }, {passive:false});
    });

    function whenText(){
      if (!st.date) return null;
      return WEEKDAY[st.date.getDay()] + ", " + pad(st.date.getDate()) + "/" + pad(st.date.getMonth() + 1) + "/" + st.date.getFullYear();
    }
    function timeText(){ return pad(st.hour) + ":" + pad(st.min); }
    function renderWhen(){
      $("#when").textContent = st.date ? "♥ " + whenText() + " lúc " + timeText() : "♥ Chọn ngày ở trên nha, giờ thì chị chỉnh thoải mái";
    }

    /* --- Phim --- */
    $("#movies").innerHTML = MOVIES.map(function(mv){
      return '<button type="button" class="movie" data-id="' + mv.id + '" aria-pressed="false"><b>' + mv.icon + " " + mv.name + '</b><span>' + mv.desc + '</span></button>';
    }).join("");
    $("#movies").addEventListener("click", function(e){
      var b = e.target.closest(".movie"); if (!b) return;
      st.movie = MOVIES.filter(function(m){ return m.id === b.dataset.id; })[0];
      Array.prototype.forEach.call(document.querySelectorAll(".movie"), function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      $("#hint").textContent = "";
    });

    $("#confirm").addEventListener("click", function(){
      var hint = $("#hint");
      if (!st.date){ hint.textContent = "Chị chọn ngày trước nha 💗"; $("#days").scrollIntoView({block:"center"}); return; }
      if (!st.movie){ hint.textContent = "Chị chọn một bộ phim nữa là xong nè 🍿"; return; }
      showDone();
    });

    function showDone(){
      var s3 = $("#s3");
      $("#s1").hidden = true; $("#s2").hidden = true; s3.hidden = false;
      s3.innerHTML =
        '<div class="center"><span class="pill">Yayyy 💗</span></div>' +
        '<h2>Chốt vé rồiii ✨</h2>' +
        '<div class="ticket">' +
          '<p>Vậy là mình hẹn xem <b id="dMovie"></b> nha 💗</p>' +
          '<p style="margin-top:10px">Chị muốn đi tầm <b>' + timeText() + '</b>, em sẽ canh đặt vé với bắp nước sát giờ đó cho mình, chị chỉ cần tới thôi 🍿✨</p>' +
        '</div>' +
        '<div class="table">' +
          '<div class="row"><span>Người mời</span><b id="dFrom"></b></div>' +
          '<div class="row"><span>Người được mời</span><b id="dTo"></b></div>' +
          '<div class="row"><span>Ngày</span><b>' + whenText() + '</b></div>' +
          '<div class="row"><span>Giờ mong muốn</span><b>' + timeText() + '</b></div>' +
          '<div class="row"><span>Phim</span><b id="dMovie2"></b></div>' +
        '</div>' +
        '<button class="btn ghost-btn" id="redo" type="button">Chọn lại nè</button>' +
        '<button class="btn send" id="reply" type="button">Nhắn lại cho <span id="dFrom2"></span> 💌</button>' +
        '<p class="foot">Em giữ ghế đôi đẹp nhất rồi đó, đừng bùng nha 😆💗</p>';
      $("#dMovie").textContent = st.movie.name;
      $("#dMovie2").textContent = st.movie.name;
      $("#dFrom").textContent = data.from;
      $("#dFrom2").textContent = data.from;
      $("#dTo").textContent = data.to;
      burst();
      window.scrollTo({top:0, behavior: reduced() ? "auto" : "smooth"});

      $("#redo").onclick = function(){
        s3.hidden = true; $("#s1").hidden = false; $("#s2").hidden = false;
        $("#s2").scrollIntoView({block:"start"});
      };
      $("#reply").onclick = function(){
        var msg = "Dạ chị đi xem " + st.movie.name + " nha! " + whenText() + " lúc " + timeText() + " 💗";
        if (navigator.share){
          navigator.share({text: msg}).catch(function(){});
        } else {
          copyText(msg).then(function(){ toast("Đã sao chép, dán gửi " + data.from + " nha 💗"); }, function(){ toast(msg); });
        }
      };
    }

    renderCal(); renderTime(); renderWhen();
  }

  function render(){
    window.scrollTo(0, 0);
    renderInvite({from:"JiChangThanh", to:"Chị Mytrauuu xinh gáiii"});
  }
  render();
})();
</script>
</body>
</html>
